<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-label="Acompanhamento de projetos"><rect x="0" y="0" width="1100" height="740" rx="9" fill="#f3f6fa" stroke="#d8e1eb"/><rect x="20" y="20" width="1060" height="62" rx="9" fill="#112c44" stroke="#112c44"/><text x="42" y="59" font-family="Arial,sans-serif" font-size="25" fill="#fff">labrary digital</text><text x="585" y="57" font-family="Arial,sans-serif" font-size="16" fill="#fff">Acervo   |   Meu projeto   |   Área docente</text><text x="40" y="126" font-family="Arial,sans-serif" font-size="28" fill="#24334a">Acompanhamento de projetos</text><text x="40" y="157" font-family="Arial,sans-serif" font-size="16" fill="#5c6c80">Avaliador: somente grupos atribuídos. Professor: grupos de sua turma.</text><rect x="40" y="190" width="480" height="50" rx="9" fill="#fff" stroke="#d8e1eb"/><text x="55" y="221" font-family="Arial,sans-serif" font-size="16" fill="#24334a">Filtrar grupo...</text><rect x="542" y="190" width="518" height="50" rx="9" fill="#fff" stroke="#d8e1eb"/><text x="558" y="221" font-family="Arial,sans-serif" font-size="16" fill="#24334a">Estado: todos</text><text x="40" y="278" font-family="Arial,sans-serif" font-size="17" fill="#24334a">Grupo / estado / pendências / ações</text><rect x="40" y="300" width="1020" height="70" rx="9" fill="#fff" stroke="#d8e1eb"/><text x="58" y="342" font-family="Arial,sans-serif" font-size="18" fill="#24334a">Grupo 01 | Em preparação | Manual pendente</text><rect x="865" y="315" width="180" height="40" rx="9" fill="#147d82" stroke="#147d82"/><text x="879" y="341" font-family="Arial,sans-serif" font-size="15" fill="#fff">Ver e comentar</text><rect x="40" y="388" width="1020" height="70" rx="9" fill="#fff" stroke="#d8e1eb"/><text x="58" y="430" font-family="Arial,sans-serif" font-size="18" fill="#24334a">Grupo 02 | Ajustes solicitados | Relatório v2</text><rect x="865" y="403" width="180" height="40" rx="9" fill="#147d82" stroke="#147d82"/><text x="879" y="429" font-family="Arial,sans-serif" font-size="15" fill="#fff">Ver e comentar</text><rect x="40" y="476" width="1020" height="70" rx="9" fill="#fff" stroke="#d8e1eb"/><text x="58" y="518" font-family="Arial,sans-serif" font-size="18" fill="#24334a">Grupo 03 | Em avaliação | Entrega completa</text><rect x="865" y="491" width="180" height="40" rx="9" fill="#147d82" stroke="#147d82"/><text x="879" y="517" font-family="Arial,sans-serif" font-size="15" fill="#fff">Ver e comentar</text><text x="40" y="623" font-family="Arial,sans-serif" font-size="16" fill="#24334a">Nenhum projeto atribuído? O professor pode revisar os vínculos.</text><text x="40" y="712" font-family="Arial,sans-serif" font-size="13" fill="#5c6c80">Protótipo estático • dados fictícios • proposta para validação do grupo</text></svg>